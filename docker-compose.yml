services:
  db:
    image: mysql:8.4
    container_name: muebleria_anahi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-muebleria_anahi}
      MYSQL_USER: ${DB_USER:-anahi_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Anahi2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: muebleria_anahi_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --config deploy/gunicorn.conf.py"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DB_NAME: ${DB_NAME:-muebleria_anahi}
      DB_USER: ${DB_USER:-anahi_app}
      DB_PASSWORD: ${DB_PASSWORD:-Anahi2026}
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  static_volume:
  media_volume:

