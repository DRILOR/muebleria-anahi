# Configuración de Nginx para Carpintería y Mueblería Anahí

upstream django_muebleria {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name muebleria.local 127.0.0.1;

    client_max_body_size 20M;

    # Registro de accesos y errores
    access_log /var/log/nginx/muebleria_anahi_access.log;
    error_log /var/log/nginx/muebleria_anahi_error.log warn;

    # Archivos estáticos
    location /static/ {
        alias /home/helen/Proyectos/muebleria-anahi/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Archivos multimedia
    location /media/ {
        alias /home/helen/Proyectos/muebleria-anahi/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Endpoint de verificación de estado (sin caché)
    location /health/ {
        proxy_pass http://django_muebleria/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Enrutamiento a la aplicación WSGI
    location / {
        proxy_pass http://django_muebleria;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;

        # Cabeceras de seguridad
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}

