{% extends "base.html" %}

{% block title %}Página no encontrada — Mueblería Anahí{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
    <div style="font-size: 3.5rem; font-weight: bold; color: #69452d; line-height: 1;">404</div>
    <h2 style="margin-top: 1rem; margin-bottom: 0.5rem; color: #333;">Página no encontrada</h2>
    <p style="color: #666; margin-bottom: 2rem; font-size: 1rem;">
        El recurso que buscas no existe o ha sido trasladado. Comprueba la dirección en tu navegador o regresa al panel de inventario.
    </p>
    <div>
        <a href="{% url 'inventario:producto_lista' %}" class="btn" style="background-color: #69452d; color: #fff; text-decoration: none; padding: 0.6rem 1.4rem; border-radius: 4px; font-weight: 500;">
            Ir al inicio
        </a>
    </div>
</div>
{% endblock %}
