{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Mueblería Anahí
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/app.css' %}">
</head>

<body>

<header class="topbar">
    <div>
        <h1>Mueblería Anahí</h1>
        <span>Sistema de Gestión de Inventario</span>
    </div>

    <nav>
        <a href="{% url 'inventario:producto_lista' %}">
            Productos
        </a>

        <a href="/admin/">
            Administración
        </a>
    </nav>
</header>

<main class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="mensaje">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
