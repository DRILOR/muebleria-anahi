<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor — Mueblería Anahí</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8f6f2;
            color: #333;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .container {
            max-width: 580px;
            background: #fff;
            padding: 3rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
            border-top: 5px solid #69452d;
        }
        h1 {
            font-size: 3.5rem;
            color: #69452d;
            margin: 0 0 0.5rem 0;
        }
        h2 {
            font-size: 1.4rem;
            color: #2b2b2b;
            margin-top: 0;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        a.btn {
            display: inline-block;
            background-color: #69452d;
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        a.btn:hover {
            background-color: #533622;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Error interno del servidor</h2>
        <p>
            Ha ocurrido un problema inesperado en el sistema. El incidente ha sido registrado para su análisis por el equipo técnico. Por favor, intenta recargar la página en unos momentos.
        </p>
        <a href="/" class="btn">Volver al sistema</a>
    </div>
</body>
</html>
